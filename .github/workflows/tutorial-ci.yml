name: Tutorial CI

on:
  pull_request: 
  push: 
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show GitHub context
        run: |
          echo "event: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "ref: ${{ github.sha }}"

      - name: List repo files
        run: ls -la

      - name: Run tests
        run: cargo test --all

